name: CI

# Every plugin runs `claude plugin validate`, `tsc -p`, and `claude plugin test` against two Claude
# Code builds. The pinned build is the last one the plugins were tested through (each plugin's
# TESTED_THROUGH names it). The latest build tells us early that an update broke a plugin.
#
# Branch protection requires only "check (pinned)". "check (latest)" never blocks a change.
# None of the three commands needs an API key, so fork pull requests run the full matrix.
#
# Job `check` runs pull-request code and installs the floating `latest` build with install scripts
# on, so it holds `contents: read` and nothing else. On the weekly schedule, and on a manual run,
# its latest leg hands its failure logs and the Claude Code version to job `report` as an
# artifact. `report` is the only job with `issues: write`. It reads the plugin list through the API
# at the run's own commit, but still checks out and runs no repository code. Only people with write
# access can start a manual run, so `issues: write` there does not reintroduce the exposure pull
# requests had.
#
# Job `canary-harness` runs .github/tests/canary-report.sh, which pulls the `report` script out of
# this file and runs it against a stub `gh`. It holds `contents: read`, installs no Claude Code, and
# needs no network. It has no path filter because the workflow has none: it takes seconds, and any
# change to this file, to that harness or to scripts/check.sh runs it.
#
# A manual run defaults to a dry run: `report` prints the issues it would open instead of opening
# them, which exercises the canary path without waiting for Monday.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the canary issues instead of opening them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_AUTOUPDATER: '1'
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  check:
    name: check (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.channel == 'latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'schedule' && '[{"channel":"latest","version":"latest"}]' || '[{"channel":"pinned","version":"2.1.295"},{"channel":"latest","version":"latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code and TypeScript
        env:
          CLAUDE_CODE_VERSION: ${{ matrix.version }}
        run: |
          # --ignore-scripts is safe: typescript, the only dependency, has no install scripts.
          npm ci --ignore-scripts
          npm install --ignore-scripts=false --prefix "$RUNNER_TEMP/tools" "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Show the installed builds
        run: |
          claude --version
          node_modules/.bin/tsc --version

      - name: Check the pinned build is the one every plugin was tested through
        if: matrix.channel == 'pinned'
        env:
          PINNED_VERSION: ${{ matrix.version }}
        run: |
          for file in plugins/*/hooks/engine-version.ts; do
            grep -q "TESTED_THROUGH = '${PINNED_VERSION}'" "$file" || { echo "$file does not name ${PINNED_VERSION}"; exit 1; }
          done

      - name: Check every plugin with scripts/check.sh
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/failures
        run: scripts/check.sh

      - name: Record the Claude Code version for the canary issue job
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.channel == 'latest'
        run: |
          mkdir -p "$RUNNER_TEMP/failures"
          v=$(claude --version)
          printf '%s\n' "${v%% *}" > "$RUNNER_TEMP/failures/claude-version"

      - name: Upload the canary failure logs
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.channel == 'latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-failures
          path: ${{ runner.temp }}/failures
          retention-days: 1
          if-no-files-found: error

  canary-harness:
    name: canary report harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the canary report harness against the real report script
        run: .github/tests/canary-report.sh

  report:
    name: open canary issues
    needs: check
    # `check (latest)` is continue-on-error, so `needs` succeeds even when the new build broke a
    # plugin. `!cancelled()` still runs this job if `check` itself fails; `always()` would also
    # run it after a cancel.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A schedule run and a manual run must not race to open the same issue. GitHub keeps one running
    # and one pending run per group, and a newer pending run replaces the older pending one even with
    # cancel-in-progress false. A manual dry run queued behind a running report can therefore drop a
    # scheduled live run that was also waiting. The window is the few seconds the job runs, and the
    # next scheduled run opens the issue, so the group is left as it is.
    concurrency:
      group: canary-report-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      # download-artifact fails when the artifact is absent, which means `check (latest)` died
      # before it could upload anything. A missing `claude-version` or `checked` file inside the
      # artifact is reported by the script below. Only the latest leg uploads, so the artifact name
      # never collides.
      - name: Download the canary artifact (missing means check (latest) died before uploading it)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-failures
          path: ${{ runner.temp }}/failures

      - name: Open an issue for each plugin the new build breaks
        env:
          # The artifact is untrusted: `check (latest)` runs a floating npm build with install
          # scripts on, so it controls every file name and byte in it. Issues are opened only for
          # plugins that exist in the repository, at most this many per run, with the log fenced so
          # it can't escape.
          MAX_ISSUES: 5
          # GitHub rejects issue bodies over 65536 characters. A log with a backtick run of this
          # length or more is withheld from the body, so the fence cannot push the body past the
          # limit.
          MAX_FENCE: 64
        # Without a shell key Actions runs `bash -e`. This pins `bash -eo pipefail` so the script runs
        # under the same options in the harness, which is stricter, and so no pipeline below depends on
        # an unstated default.
        shell: bash
        run: |
          problems=0
          failures="$RUNNER_TEMP/failures"

          # Untrusted bytes must not reach stdout where the runner would read them as workflow
          # commands, so they are printed between stop-commands markers.
          print_untrusted() {
            local token
            token=$(openssl rand -hex 16)
            echo "::stop-commands::${token}"
            cat "$1"
            echo "::${token}::"
          }

          if [ ! -e "$failures/checked" ]; then
            echo 'check (latest) did not reach the plugin checks, so a clean artifact proves nothing.'
            problems=1
          fi

          # Without a valid version no title can be built, so no issue is opened. Everything else
          # (the marker message, the summary, the other problems) is still reported.
          can_open=true
          version=$(cat "$failures/claude-version") || version=''
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            # %q does not escape ':'. A version such as "::error::x" cannot become a workflow command
            # only because this text comes first on the line, so keep a prefix on every line that
            # prints the version.
            printf 'Unexpected Claude Code version: %q\n' "$version"
            problems=1
            can_open=false
          fi

          plugins=$(gh api "repos/${GH_REPO}/contents/plugins?ref=${GITHUB_SHA}" --jq '.[] | select(.type=="dir") | .name') || {
            echo 'Failed to list the plugins in the repository.'
            problems=1
            plugins=''
          }

          shopt -s nullglob
          logs=("$failures"/*.txt)
          mode=live
          [ "$DRY_RUN" != true ] || mode=dry-run
          printf 'Canary summary: mode=%s version=%q failing_logs=%s\n' "$mode" "$version" "${#logs[@]}"
          if [ "${#logs[@]}" = 0 ] && [ "$DRY_RUN" = true ]; then
            echo 'dry run: no failure logs, nothing to open'
          fi
          if [ "$can_open" != true ] && [ "${#logs[@]}" != 0 ]; then
            echo "Opening nothing for ${#logs[@]} failing logs because the version is invalid."
            logs=()
          fi

          opened=0
          left_unopened=()
          for log in "${logs[@]}"; do
            plugin=$(basename "$log" .txt)
            if [[ ! "$plugin" =~ ^[a-z0-9][a-z0-9-]*$ ]] \
              || [ "$log" != "$failures/${plugin}.txt" ] \
              || [ -L "$log" ] || [ ! -f "$log" ] \
              || ! grep -qxF -- "$plugin" <<< "$plugins"; then
              printf 'Skipping an untrusted log: %q\n' "$plugin"
              problems=1
              continue
            fi
            title="Claude Code ${version} breaks ${plugin}"
            # --search reads an index that lags behind new issues, so list the open issues instead
            # and compare the whole title here. --limit lifts gh's default of 30 results.
            # SAFETY: this repo keeps far fewer than 1000 issues open. Past that, a duplicate could
            # slip through, and MAX_ISSUES still bounds how many a run opens.
            open=$(TITLE="$title" gh issue list --state open --limit 1000 --json title --jq '[.[] | select(.title == env.TITLE)] | length') || {
              echo "Failed to list issues for ${title}"
              problems=1
              continue
            }
            if [ "$open" != 0 ]; then
              if [ "$DRY_RUN" = true ]; then
                echo "dry run: issue already open for ${title}"
              else
                echo "Issue already open for ${title}; not opening another."
              fi
              continue
            fi
            if [ "$opened" -ge "$MAX_ISSUES" ]; then
              left_unopened+=("$plugin")
              continue
            fi
            # Passing-test lines are most of a long log and would push the failing test out of the
            # tail. grep exits 1 when nothing is left to print, which pipefail would turn into a failed
            # job, so each grep is allowed to find nothing.
            { grep -av '^(pass) ' "$log" || true; } | tail -c 60000 | tr -d '\000' > "$RUNNER_TEMP/log-tail.txt"
            longest=$({ grep -ao '`*' "$RUNNER_TEMP/log-tail.txt" || true; } | awk '{ if (length($0) > max) max = length($0) } END { print max + 0 }')
            {
              echo "The canary ran ${plugin}'s checks against Claude Code ${version} and they failed."
              echo "Full log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo 'The fix moves the pinned build in this workflow and TESTED_THROUGH in the plugin forward.'
              echo
              if [ "$longest" -ge "$MAX_FENCE" ]; then
                echo "The log is withheld because it contains an unusually long backtick run. Read it in the full log linked above."
              else
                fence=$(printf '`%.0s' $(seq 1 $(( longest > 2 ? longest + 1 : 3 ))))
                echo "$fence"
                cat "$RUNNER_TEMP/log-tail.txt"
                [ -z "$(tail -c 1 "$RUNNER_TEMP/log-tail.txt")" ] || echo
                echo "$fence"
              fi
            } > "$RUNNER_TEMP/issue-body.md"
            if [ "$DRY_RUN" = true ]; then
              echo "dry run: would open an issue titled: ${title}"
              print_untrusted "$RUNNER_TEMP/issue-body.md"
            else
              # A failed create does not count toward the cap, so a later plugin still gets its turn.
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue-body.md" || {
                echo "Failed to create an issue for ${title}"
                problems=1
                continue
              }
            fi
            opened=$((opened + 1))
          done
          if [ "${#left_unopened[@]}" != 0 ]; then
            verb=Opened
            [ "$DRY_RUN" != true ] || verb='Would open'
            echo "${verb} ${opened} issues, the cap; ${#left_unopened[@]} more failing plugins were left unopened: ${left_unopened[*]}"
            problems=1
          fi
          exit "$problems"
