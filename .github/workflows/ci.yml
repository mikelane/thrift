name: CI

# Every plugin runs `claude plugin validate`, `tsc -p`, and `claude plugin test` against two Claude
# Code builds. The pinned build is the last one the plugins were tested through (each plugin's
# TESTED_THROUGH names it). The latest build tells us early that an update broke a plugin.
#
# Branch protection requires only "check (pinned)". "check (latest)" never blocks a change.
# None of the three commands needs an API key, so fork pull requests run the full matrix.
#
# Job `check` runs pull-request code and installs the floating `latest` build with install scripts
# on, so it holds `contents: read` and nothing else. On the weekly schedule, and on a manual run,
# its latest leg hands its failure logs and the Claude Code version to job `report` as an
# artifact. `report` is the only job with `issues: write`; it checks out nothing and runs no
# repository code. Only people with write access can start a manual run, so `issues: write` there
# does not reintroduce the exposure pull requests had.
#
# A manual run defaults to a dry run: `report` prints the issues it would open instead of opening
# them, which exercises the canary path without waiting for Monday.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the canary issues instead of opening them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_AUTOUPDATER: '1'
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  check:
    name: check (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.channel == 'latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'schedule' && '[{"channel":"latest","version":"latest"}]' || '[{"channel":"pinned","version":"2.1.295"},{"channel":"latest","version":"latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code and TypeScript
        env:
          CLAUDE_CODE_VERSION: ${{ matrix.version }}
        run: |
          npm install --ignore-scripts=false --prefix "$RUNNER_TEMP/tools" "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" typescript@5.6.3
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Show the installed builds
        run: |
          claude --version
          tsc --version

      - name: Check the pinned build is the one every plugin was tested through
        if: matrix.channel == 'pinned'
        env:
          PINNED_VERSION: ${{ matrix.version }}
        run: |
          for file in plugins/*/hooks/engine-version.ts; do
            grep -q "TESTED_THROUGH = '${PINNED_VERSION}'" "$file" || { echo "$file does not name ${PINNED_VERSION}"; exit 1; }
          done

      - name: Let the engine write each plugin's type declarations
        run: |
          for dir in plugins/*/; do
            CLAUDE_CODE_PLUGIN_DIR_WATCH=1 claude -p x --plugin-dir "$dir" > /dev/null 2>&1 || true
            test -f "${dir}.claude-plugin/types/claude-code/index.d.ts" || { echo "No declarations were written for $dir"; exit 1; }
          done

      - name: Validate, type-check, and test every plugin
        run: |
          mkdir -p "$RUNNER_TEMP/failures"
          status=0
          for dir in plugins/*/; do
            name=$(basename "$dir")
            log="$RUNNER_TEMP/failures/$name.txt"
            {
              echo '## claude plugin validate'
              claude plugin validate "plugins/$name" &&
                echo '## tsc -p' &&
                tsc -p "plugins/$name" &&
                echo '## claude plugin test' &&
                claude plugin test "plugins/$name"
            } > "$log" 2>&1 && rm "$log" || { cat "$log"; status=1; }
          done
          touch "$RUNNER_TEMP/failures/checked"
          exit "$status"

      - name: Record the Claude Code version for the canary issue job
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.channel == 'latest'
        run: |
          mkdir -p "$RUNNER_TEMP/failures"
          claude --version | cut -d' ' -f1 > "$RUNNER_TEMP/failures/claude-version"

      - name: Upload the canary failure logs
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.channel == 'latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-failures
          path: ${{ runner.temp }}/failures
          retention-days: 1
          if-no-files-found: error

  report:
    name: open canary issues
    needs: check
    # `check (latest)` is continue-on-error, so `needs` succeeds even when the new build broke a
    # plugin. `!cancelled()` still runs this job if `check` itself fails; `always()` would also
    # run it after a cancel.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      # A missing artifact means `check` died before it could record the version, and a missing
      # `checked` marker means it died before looping over every plugin. Failing on either keeps
      # a crashed `check` from passing as "no plugin broke". Only the latest leg uploads, so the artifact name never collides.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-failures
          path: ${{ runner.temp }}/failures

      - name: Open an issue for each plugin the new build breaks
        env:
          # The artifact is untrusted: `check (latest)` runs a floating npm build with install
          # scripts on, so it controls every file name and byte in it. Issues are opened only for
          # plugin-shaped names, at most this many per run, with the log fenced so it can't escape.
          MAX_ISSUES: 5
        run: |
          problems=0
          version=$(cat "$RUNNER_TEMP/failures/claude-version")
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Unexpected Claude Code version: ${version}"; exit 1; }
          if [ ! -e "$RUNNER_TEMP/failures/checked" ]; then
            echo 'check (latest) did not reach the plugin checks, so a clean artifact proves nothing.'
            problems=1
          fi
          shopt -s nullglob
          logs=("$RUNNER_TEMP"/failures/*.txt)
          if [ "${#logs[@]}" = 0 ] && [ "$DRY_RUN" = true ]; then
            echo 'dry run: no failure logs, nothing to open'
          fi
          opened=0
          unopened=0
          for log in "${logs[@]}"; do
            plugin=$(basename "$log" .txt)
            if [[ ! "$plugin" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              printf 'Skipping a log with an unexpected name: %q\n' "$plugin"
              problems=1
              continue
            fi
            if [ "$opened" -ge "$MAX_ISSUES" ]; then
              unopened=$((unopened + 1))
              continue
            fi
            title="Claude Code ${version} breaks ${plugin}"
            open=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq 'length')
            if [ "$open" != 0 ]; then
              [ "$DRY_RUN" != true ] || echo "dry run: issue already open for ${title}"
              continue
            fi
            opened=$((opened + 1))
            tail -c 60000 "$log" > "$RUNNER_TEMP/log-tail.txt"
            longest=$(grep -o '`*' "$RUNNER_TEMP/log-tail.txt" | awk '{ if (length($0) > max) max = length($0) } END { print max + 0 }')
            fence=$(printf '`%.0s' $(seq 1 $(( longest > 2 ? longest + 1 : 3 ))))
            {
              echo "The canary ran ${plugin}'s checks against Claude Code ${version} and they failed."
              echo
              echo 'The fix moves the pinned build in this workflow and TESTED_THROUGH in the plugin forward.'
              echo
              echo "$fence"
              cat "$RUNNER_TEMP/log-tail.txt"
              echo "$fence"
            } > "$RUNNER_TEMP/issue-body.md"
            if [ "$DRY_RUN" = true ]; then
              echo "dry run: would open an issue titled: ${title}"
              cat "$RUNNER_TEMP/issue-body.md"
            else
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
            fi
          done
          if [ "$unopened" != 0 ]; then
            echo "Opened ${opened} issues, the cap; ${unopened} more failing plugins were left unopened."
            problems=1
          fi
          exit "$problems"
