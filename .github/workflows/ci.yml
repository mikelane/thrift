name: CI

# Every plugin runs `claude plugin validate`, `tsc -p`, and `claude plugin test` against two Claude
# Code builds. The pinned build is the last one the plugins were tested through (each plugin's
# TESTED_THROUGH names it). The latest build tells us early that an update broke a plugin.
#
# Branch protection requires only "check (pinned)". "check (latest)" never blocks a change.
# None of the three commands needs an API key, so fork pull requests run the full matrix.
#
# Job `check` runs pull-request code and installs the floating `latest` build with install scripts
# on, so it holds `contents: read` and nothing else. On the weekly schedule it hands its failure
# logs and the Claude Code version to job `report` as an artifact. `report` is the only job with
# `issues: write`; it checks out nothing and runs no repository code.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_AUTOUPDATER: '1'
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  check:
    name: check (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.channel == 'latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'schedule' && '[{"channel":"latest","version":"latest"}]' || '[{"channel":"pinned","version":"2.1.295"},{"channel":"latest","version":"latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code and TypeScript
        env:
          CLAUDE_CODE_VERSION: ${{ matrix.version }}
        run: |
          npm install --ignore-scripts=false --prefix "$RUNNER_TEMP/tools" "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" typescript@5.6.3
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Show the installed builds
        run: |
          claude --version
          tsc --version

      - name: Check the pinned build is the one every plugin was tested through
        if: matrix.channel == 'pinned'
        env:
          PINNED_VERSION: ${{ matrix.version }}
        run: |
          for file in plugins/*/hooks/engine-version.ts; do
            grep -q "TESTED_THROUGH = '${PINNED_VERSION}'" "$file" || { echo "$file does not name ${PINNED_VERSION}"; exit 1; }
          done

      - name: Let the engine write each plugin's type declarations
        run: |
          for dir in plugins/*/; do
            CLAUDE_CODE_PLUGIN_DIR_WATCH=1 claude -p x --plugin-dir "$dir" > /dev/null 2>&1 || true
            test -f "${dir}.claude-plugin/types/claude-code/index.d.ts" || { echo "No declarations were written for $dir"; exit 1; }
          done

      - name: Validate, type-check, and test every plugin
        run: |
          mkdir -p "$RUNNER_TEMP/failures"
          status=0
          for dir in plugins/*/; do
            name=$(basename "$dir")
            log="$RUNNER_TEMP/failures/$name.txt"
            {
              echo '## claude plugin validate'
              claude plugin validate "plugins/$name" &&
                echo '## tsc -p' &&
                tsc -p "plugins/$name" &&
                echo '## claude plugin test' &&
                claude plugin test "plugins/$name"
            } > "$log" 2>&1 && rm "$log" || { cat "$log"; status=1; }
          done
          exit "$status"

      - name: Record the Claude Code version for the canary issue job
        if: always() && github.event_name == 'schedule'
        run: |
          mkdir -p "$RUNNER_TEMP/failures"
          claude --version | cut -d' ' -f1 > "$RUNNER_TEMP/failures/claude-version"

      - name: Upload the canary failure logs
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-failures
          path: ${{ runner.temp }}/failures
          retention-days: 1
          if-no-files-found: error

  report:
    name: open canary issues
    needs: check
    # `check (latest)` is continue-on-error, so `needs` succeeds even when the new build broke a
    # plugin. `!cancelled()` still runs this job if `check` itself fails; `always()` would also
    # run it after a cancel.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A missing artifact means `check` died before it could record the version. Failing here
      # (download-artifact errors when the artifact is absent) keeps that from passing as "no
      # plugin broke".
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-failures
          path: ${{ runner.temp }}/failures

      - name: Open an issue for each plugin the new build breaks
        run: |
          version=$(cat "$RUNNER_TEMP/failures/claude-version")
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Unexpected Claude Code version: ${version}"; exit 1; }
          for log in "$RUNNER_TEMP"/failures/*.txt; do
            [ -e "$log" ] || continue
            plugin=$(basename "$log" .txt)
            title="Claude Code ${version} breaks ${plugin}"
            open=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq 'length')
            [ "$open" = 0 ] || continue
            {
              echo "The weekly canary ran ${plugin}'s checks against Claude Code ${version} and they failed."
              echo
              echo 'The fix moves the pinned build in this workflow and TESTED_THROUGH in the plugin forward.'
              echo
              echo '```'
              tail -c 60000 "$log"
              echo '```'
            } > "$RUNNER_TEMP/issue-body.md"
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
          done
